<svg xmlns="http://www.w3.org/2000/svg" id="jfg-layout" viewBox="0 0 960 630" role="img" aria-labelledby="jfg-layout-title jfg-layout-desc">
<title id="jfg-layout-title">Module growth changes later ROM positions and boundary references</title>
<desc id="jfg-layout-desc">The documented module-79 edit grows its packed payload from 152 to 176 bytes. Later modules and name boundaries move by 24 bytes. Earlier modules stay in place. Terminal fill shrinks by 24 bytes. BSS occupies RAM after DATA in the module allocation; it has no initialized ROM payload.</desc>
<style>#jfg-layout text{font-family:Arial,Helvetica,sans-serif;fill:#192c39}#jfg-layout .h{font-size:26px;font-weight:700}#jfg-layout .label{font-size:22px;font-weight:700}#jfg-layout .small{font-size:20px}</style>
<rect width="960" height="630" rx="18" fill="#fff"/>
<text x="30" y="40" class="h">Module growth and computed ROM positions</text>
<text x="30" y="78" class="small">Module-79 DATA edit. Schematic widths. Cartridge size stays 32 MiB.</text>
<text x="30" y="127" class="label">BASELINE</text>
<rect x="30" y="148" width="170" height="105" fill="#edf0f4" stroke="#9aa9b7"/><text x="44" y="185" class="label">Earlier</text><text x="44" y="219" class="small">modules</text>
<rect x="200" y="148" width="190" height="105" fill="#d9ede7" stroke="#448b7d"/><text x="215" y="185" class="label">Module 79</text><text x="215" y="219" class="small">152 bytes</text>
<rect x="390" y="148" width="330" height="105" fill="#eaf0fb" stroke="#6389b3"/><text x="407" y="185" class="label">Later modules and names</text><text x="407" y="219" class="small">Existing boundary positions</text>
<rect x="720" y="148" width="210" height="105" fill="#fff4dc" stroke="#c19c4b"/><text x="736" y="185" class="label">Terminal fill</text><text x="736" y="219" class="small">Available space</text>
<text x="30" y="302" class="label">LIVE EDIT</text>
<rect x="30" y="323" width="170" height="105" fill="#edf0f4" stroke="#9aa9b7"/><text x="44" y="360" class="label">Earlier</text><text x="44" y="394" class="small">Unchanged</text>
<rect x="200" y="323" width="230" height="105" fill="#d9ede7" stroke="#448b7d"/><text x="215" y="360" class="label">Module 79</text><text x="215" y="394" class="small">176 bytes (+24)</text>
<rect x="430" y="323" width="330" height="105" fill="#eaf0fb" stroke="#6389b3"/><text x="447" y="360" class="label">Later modules and names</text><text x="447" y="394" class="small">Positions move by 24 bytes</text>
<rect x="760" y="323" width="170" height="105" fill="#fff4dc" stroke="#c19c4b"/><text x="776" y="360" class="label">Fill</text><text x="776" y="394" class="small">24 bytes less</text>
<text x="30" y="478" class="small">Recompute headers, name boundaries, and their real resident references.</text>
<text x="30" y="512" class="small">Keep every unselected payload and runtime record unchanged.</text>
<rect x="30" y="545" width="900" height="62" rx="8" fill="#f2f5f7"/>
<text x="46" y="573" class="label">BSS occupies RAM after DATA in the same module allocation.</text>
<text x="46" y="598" class="small">The loader zeroes those bytes; BSS adds no initialized ROM payload.</text>
</svg>
