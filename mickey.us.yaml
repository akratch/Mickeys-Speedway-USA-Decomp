      # 16-byte block, and camCopyOrthoMatrix's target re-materialises it between
      # D_80079F4C and D_80079F50.
      - [0x7AB40, .data, main/camera]
      - [0x7AB60, data]
      # Scheduler retrace counter: an initialized u64 at its ROM-proved slot.
      # The adjacent raw data resumes immediately after its eight owned bytes.
      - [0x7B260, .data, main/sched]
      - [0x7B268, data]
      # fxSPDPRipple's three function-static wave phases (0, 0x5555, 0xAAAA),
      # one word each, and the zero word that rounds IDO's .data input
      # section to 16 bytes: fx.c.o's whole section, so no trim.
      - [0x7DF70, .data, main/fx]
      - [0x7DF80, data]
      # Four typed texture callbacks. Ordinary relocation binds the first to
      # the trap; its source name supplies the main DATA record's export.
      - [0x7E07C, .data, main/fxTextureCallbacks]
      - [0x7E08C, data]
      # n_csplayer's 127-entry timing table followed by its zero flag. The
      # 0x200-byte object section and first address are fixed by the compiled
      # candidate and Mickey's own relocations.
      - [0x80B60, .data, libultra/n_csplayer]
      # n_alGlobals/n_syn (libultra/n_sl, the n_audio driver-singleton
      # pointers): measured from a built candidate object diffed against the
      # ROM bytes (tools/wb_compare.sh --rom n_alInit --show-diff), which
      # showed both addresses directly as load/store immediates -- lui/lw
      # 0x80080160(t6) and 0x80080164(t8/t9), 4 bytes apart, matching the
      # declaration order in JFG's n_sl.c. Explicit `= 0` initializers put
      # them in .data rather than .bss. The TU's compiled .data section is
      # 0x10 bytes (IDO pads .data to 16-byte alignment under -g), 8 bytes
      # more than the two u32s themselves; both halves are zero in the ROM
      # either way, so the boundary is set by the compiled object's own size.
      - [0x80D60, .data, libultra/n_sl]
      - [0x80D70, .data, libultra/n_synthesizer]
      - [0x80D80, .data, libultra/n_drvrNew]
      - [0x80DC0, .data, libultra/n_env]
      - [0x80EC0, data]
      # Named SDK-owned initialized-data tails.  Each boundary is fixed by the
      # matching reference object's section size and by the ROM relocation(s)
      # that address the first symbol; anonymous gaps remain explicitly raw.
      - [0x81040, .data, libultra/aisetnextbuf]
      - [0x81050, .data, libultra/initialize]
      - [0x81060, .data, libultra/controller]
      - [0x81070, .data, libultra/vimgr]
      - [0x81090, data]
      - [0x81460, .data, libultra/thread]
      - [0x81480, .data, libultra/siacs]
      - [0x81490, .data, libultra/vi]
      - [0x81500, .data, libultra/timerintr]
      - [0x81510, .data, libultra/xprintf]
      - [0x81560, .data, libultra/xlitob]
      # The conservative rodata tail remains mostly anonymous. Selected SDK
      # slices below are attached TU by TU only where reference-object size,
      # ordering, and Mickey's own references agree on the boundary.
      #
      # `gmake verify` IS NOT THE GATE FOR THIS NUMBER. Re-slicing never
      # creates, drops or reorders a byte, so a wrong boundary rebuilds the ROM
      # byte-identically and passes. This was reproduced deliberately: cutting
      # four bytes into jtbl_80080D2C leaves the build green while the jump
      # table's second half comes out as a fresh `dlabel D_80080D30` holding a
      # plain `.word 0x80007774` instead of a `.word .L80007774` -- the same
      # bytes, silently stripped of their typing. What checks a boundary is
      # reading the generated .s on both sides of it.
      #
      # WHY 0x81510. It is the first byte of an unbroken run of read-only
      # content that continues to 0x81920: a 32-space pad string, a 32-zero
      # pad string and "0123456789ABCDEF" (libultra xprintf's field-padding
      # tables), then the audio subsystem's printf format strings. The symbol
      # before it ends exactly here and holds a pointer to BSS.
      #
      # NOT 0x812C0. The one-character `.asciz "$"` at 0x812C0 and `.asciz "'"`
      # at 0x81310 are single 0x24/0x27 bytes inside a run of fixed-size binary
      # records; spimdisasm renders them as strings the same way it renders an
      # arbitrary word as a `.float`, and neither is evidence of a section.
      #
      # 0x81510 is an upper bound on the boundary, not the boundary: bytes
      # below it are undifferentiated. Closing that gap means extending the
      # jump-table ordering argument below to every `lwc1`/`la` reference in
      # the resident segment. Two things the later per-TU split needs are
      # measured and recorded here:
      #
      #   1. RODATA ORDER FOLLOWS TEXT ORDER, EXACTLY. The pre-carve inventory
      #      covered 35 functions and forty-four tables. After devmgr's table,
      #      func_80035F48's two, func_800103D4's two, func_80038190's one and func_80045D34's one moved into C objects,
      #      the 4 jump tables still emitted in asm/ remain monotonically
      #      increasing in text and table address -- ZERO
      #      INVERSIONS. They run from jtbl_80083F30 through jtbl_800841F4, so
      #      .rodata can continue to be carved TU by TU in text order.
      #
      #   2. THE REFERENCED-FROM-CODE BOUND: 0x80080D24 (ROM 0x81924). That is
      #      a float constant (7f7fffff, i.e. FLT_MAX) loaded by the function
      #      at ROM 0x50B0, and it sits TWO words below the first jump table
      #      (ROM 0x8192C, func_80007118's, now compiled into objects.c's own
      #      .rodata). It is the lowest address anything in
      #      the resident segment reads as read-only data, which is a weaker
      #      statement than 0x81510 above: the xprintf and audio strings there
      #      are read by nothing in the resident segment at all, the same
      #      pattern docs/modules.md section 7 records for the model/sprite
      #      strings, and code that never runs on the resident side cannot
      #      lower a bound derived from references.
      #
      # Both numbers are reproducible from asm/*.s alone.
      #
      # PHASE 2 TOOLING. Attaching a `.rodata` subsegment to a `c` subsegment
      # makes splat migrate that TU's constants into asm/nonmatchings/*.s as
      # `.late_rodata`.  The vendored asm-processor now recognizes splat's
      # `enddlabel` as a zero-size label directive, preserving the symbol-size
      # metadata instead of weakening asm_data_end_label for the whole tree.
      - [0x81590, rodata]
      # objects' six switch tables and six literal-pool floats retain
      # their source order in an exact 0x80C-byte input section. It opens
      # with func_80007118's 92-entry table (formerly jtbl_80080D2C).
      - [0x8192C, .rodata, main/objects]
      - [0x82138, rodata]
      # track's whole .rodata input section, 0x260 bytes: fourteen
      # "track/track.c" strings (two in matched C, twelve migrated into
      # func_8000E920's listing), three unreferenced warning strings, then
      # the literal pool and func_800103D4's two switch tables in text
      # order. The eight bytes before it are the previous object's padding.
      - [0x82140, .rodata, main/track]
      - [0x823A0, rodata]
      # func_80019934's five-entry distance-mode switch table.
      - [0x823B4, .rodata, main/lights]
      - [0x823C8, rodata]
      # charControl scalar pool, followed by its section alignment.
      - [0x82440, .rodata, main/charControl]
      - [0x824A0, rodata]
      # osScGetTaskType's seven-entry switch table and __scSchedule's
      # seven-entry switch table share this sched-owned rodata input section.
      - [0x82FD8, .rodata, main/sched]
      - [0x83010, rodata]
      # viGetOsViMode's twelve-entry video-mode switch table. The following
      # zero word is output-section padding, not owned object bytes.
      - [0x8309C, .rodata, main/gameVi]
      - [0x830CC, rodata]
      # func_80035F48's six-entry and seven-entry texture-format switch tables.
      - [0x8323C, .rodata, main/textures_354C8]
      - [0x83270, rodata]
      # func_80038190's six-entry switch table plus one zero word of the
      # object's own section padding; the "front/front.c" string follows.
      - [0x832A4, .rodata, main/frontend_37D50]
      - [0x832C0, rodata]
      # frontFreeMode, frontInitMode and frontUpdate's consecutive nineteen-entry
      # tables, plus the ROM's one zero pad word before the next float table.
      - [0x83334, .rodata, main/menu]
      # weather's literal pool: rain_render_splashes' 0.175f age step, then
      # three words of the object's own alignment padding.
      - [0x83430, .rodata, main/weather]
      - [0x83440, rodata]
      # func_80040740's switch table, then func_80040B88's two float literals
      # and one word of the object's own section padding.
      - [0x83658, .rodata, main/particles]
      # Two zero words of output padding. The particles rodata input section
      # really starts 16-aligned inside the 0x83430 blob (its strings and four
      # earlier float literals are still held there as data), so this partial
      # carve begins 8 bytes off that alignment and the object's own padding
      # stops at 0x83678.
      - [0x83678, rodata]
      # Diprint owns the formatter alphabets, strings, and compiler-generated
      # switch tables through the measured 0x838F0 boundary.
      - [0x83680, .rodata, main/diprint]
      - [0x838F0, rodata]
      # The two diRcpTrace diagnostics end at 0x83940. JFG's source-level
      # string layout reproduces diRcp's full diagnostic block, followed by
      # diRcpPrintDL's three switch tables and diRcpMoveWd's table. The word
      # at 0x8457C is output-section padding, not owned object bytes.
      - [0x83940, .rodata, main/diRcp]
      - [0x8457C, rodata]
      # func_80045D34's six-entry page switch table and the object's own
      # alignment pad; diCpu's strings and float stay in the blob above and
      # are reached by name.
      - [0x849C0, .rodata, main/diCpu]
      # fx's literal pool: func_8004A380's "%d", func_80047304's 0.33f scale
      # (a literal: as an extern global its load could not be hoisted past
      # that loop's trig calls, which reorders the prologue), fxMakeConeTextureCoords's
