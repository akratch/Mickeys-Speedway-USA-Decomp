  # Data tables + bulk compressed assets. Phase 3 splits this properly.
  - name: assets
    type: bin
    start: 0x86640
    follows_vram: main

  # 1.60 MiB between the asset band and the overlay tables. Named for its
  # position, not its content: it is not proven to be assets (its entropy is
  # well below the compressed band's) and it is not overlay data (no overlay
  # header's romAddress and no resident address literal reaches it).
  - name: unclassified
    type: bin
    start: 0x16B0000
    follows_vram: main

  # The overlay system's four ROM blocks, split at proven boundaries.
  #
  # func_800328CC (ROM 0x334CC) reads the first three and DMA-copies each into
  # a BSS pointer: mainRelocTable = copy + 4 (past the count word),
  # overlayRomTable = copy, overlayTable = copy + 0x20 (entry 0 is the
  # synthesized `main` pseudo-overlay, so the ROM's first header is overlay 1).
  # Sizes are exact, not estimated: 0x1F50/4 == 2004 RomTableEntry, 0xD60/0x20
  # == 107 OverlayHeader, and 4 + 375*8 == 0xBBC fills the reloc block bar four
  # bytes of pad.
  #
  # Each module image is [.text][.data][relocTable1][relocTable2], and
  # next.romAddress - this.romAddress == textSize + dataSize + [0x14] + [0x16]
  # for all 107 with zero mismatches, which is what proves OverlayHeader[0x10]
  # contributes no ROM bytes (it is bssSize, not rodataSize).
  #
  # `gmake overlay-tables` decodes all four blocks and re-asserts that layout
  # against the ROM; run it before trusting any boundary here.
  #
  - name: main_reloc_table
    type: bin
    start: 0x1848B70
    follows_vram: main

  - name: overlay_rom_table
    type: bin
    start: 0x1849730
    follows_vram: main

  - name: overlay_header_table
    type: bin
    start: 0x184B680
    follows_vram: main

  # BEGIN GENERATED OVERLAY SEGMENTS -- tools/overlay_atlas.py
  #
  # Generated from the shipped headers. Do not edit module arithmetic
  # here; run `gmake overlay-atlas-write` after changing the parser.
  # The common synthetic VMA preserves J-type target bits. Splat's
  # shared exclusive_ram_id marks every module as the same mutually
  # exclusive RAM class; ROM ranges and segment-qualified names keep
  # offsets distinct. Initialized bytes remain raw data_rodata except
  # where the manifest records explicit compiled-C ownership evidence.

  - name: overlay_001
    type: code
    start: 0x184C3E0
    vram: 0xF0000000
    bss_size: 0x1DE0
    align: 0x8
    subalign: 0x1
    dir: overlays/o001
    exclusive_ram_id: overlay_modules
    symbol_name_format: $SEG_$VRAM_$ROM
    subsegments:
      - [0x184C3E0, c, overlay_001]
      - [0x184CB90, c, overlay_001_build]
      - [0x184CFB4, c, overlay_001_head]
