      # The conservative rodata tail remains mostly anonymous. Selected SDK
      # slices below are attached TU by TU only where reference-object size,
      # ordering, and Mickey's own references agree on the boundary.
      #
      # `gmake verify` IS NOT THE GATE FOR THIS NUMBER. Re-slicing never
      # creates, drops or reorders a byte, so a wrong boundary rebuilds the ROM
      # byte-identically and passes. This was reproduced deliberately: cutting
      # four bytes into jtbl_80080D2C leaves the build green while the jump
      # table's second half comes out as a fresh `dlabel D_80080D30` holding a
      # plain `.word 0x80007774` instead of a `.word .L80007774` -- the same
      # bytes, silently stripped of their typing. What checks a boundary is
      # reading the generated .s on both sides of it.
      #
      # WHY 0x81510. It is the first byte of an unbroken run of read-only
      # content that continues to 0x81920: a 32-space pad string, a 32-zero
      # pad string and "0123456789ABCDEF" (libultra xprintf's field-padding
      # tables), then the audio subsystem's printf format strings. The symbol
      # before it ends exactly here and holds a pointer to BSS.
      #
      # NOT 0x812C0. The one-character `.asciz "$"` at 0x812C0 and `.asciz "'"`
      # at 0x81310 are single 0x24/0x27 bytes inside a run of fixed-size binary
      # records; spimdisasm renders them as strings the same way it renders an
      # arbitrary word as a `.float`, and neither is evidence of a section.
      #
      # 0x81510 is an upper bound on the boundary, not the boundary: bytes
      # below it are undifferentiated. Closing that gap means extending the
      # jump-table ordering argument below to every `lwc1`/`la` reference in
      # the resident segment. Two things the later per-TU split needs are
      # measured and recorded here:
      #
      #   1. RODATA ORDER FOLLOWS TEXT ORDER, EXACTLY. The pre-carve inventory
      #      covered 35 functions and forty-four tables. After devmgr's table
      #      moved into C objects, the 11 jump tables still emitted in asm/
      #      remain monotonically increasing in text and table address -- ZERO
      #      INVERSIONS. They run from jtbl_80080D2C through jtbl_800841F4, so
      #      .rodata can continue to be carved TU by TU in text order.
      #
      #   2. THE REFERENCED-FROM-CODE BOUND: 0x80080D24 (ROM 0x81924). That is
      #      a float constant (7f7fffff, i.e. FLT_MAX) loaded by the function
      #      at ROM 0x50B0, and it sits TWO words below the first jump table
      #      jtbl_80080D2C (ROM 0x8192C). It is the lowest address anything in
      #      the resident segment reads as read-only data, which is a weaker
      #      statement than 0x81510 above: the xprintf and audio strings there
      #      are read by nothing in the resident segment at all, the same
      #      pattern docs/modules.md section 7 records for the model/sprite
      #      strings, and code that never runs on the resident side cannot
      #      lower a bound derived from references.
