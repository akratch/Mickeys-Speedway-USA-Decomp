      - [0x849E0, .rodata, main/fx]
      - [0x849F0, rodata]
      # fontCreateDisplayList's eight-entry texture-format switch table. The following
      # two zero words are output-section alignment, not owned object bytes.
      - [0x849F8, .rodata, main/font]
      - [0x84A18, rodata]
      # anim's literal pool begins with func_800508D4's 0.01f scale
      # (0x3C23D70A needs its low halfword, so IDO takes it from .rodata
      # instead of a lui/mtc1 pair). Only the first word is owned by matched
      # C so far; 0x84BAC onward (0.02f and the rest) stays anonymous until
      # the anim functions that use it match.
      - [0x84BA8, .rodata, main/anim]
      - [0x84BAC, rodata]
      # vehicle_sounds' literal pool: func_8005830C's ten floats, then
      # func_80058EF4's 0.001f; the last word is the object's alignment pad.
      - [0x84EF0, .rodata, main/vehicle_sounds]
      # gsSnd diagnostics followed by func_8005BA40's 16-entry switch table.
      - [0x84F20, .rodata, main/gsSnd]
      # Five n_csplayer jump tables, in the same order and with the same
      # 0x300-byte section size as the JFG donor object.
      - [0x85070, .rodata, libultra/n_csplayer]
      - [0x85370, .rodata, libultra/n_synthesizer]
      - [0x85380, .rodata, libultra/cents2ratio]
      - [0x85390, .rodata, libultra/n_drvrNew]
      - [0x853B0, .rodata, libultra/n_synsetfxparam]
      - [0x853C0, .rodata, libultra/n_reverb]
      - [0x853F0, .rodata, libultra/n_env]
      - [0x85440, .rodata, main/math_atan]
      - [0x85460, .rodata, libultra/n_auxbus]
      - [0x85470, .rodata, libultra/n_alLPFilter]
      - [0x85480, .rodata, main/math_acosf]
      - [0x85490, .rodata, libultra/n_resample]
      - [0x854A0, .rodata, libultra/sinf]
      - [0x854F0, rodata]
      - [0x85570, .rodata, libultra/devmgr]
      - [0x85590, rodata]
      - [0x855A0, .rodata, libultra/xprintf]
      - [0x856A0, .rodata, libultra/xldtob]
      - [0x85700, rodata]
      # BSS is zero-filled by the entrypoint; no ROM bytes back it.
      - { start: 0x86640, type: bss, vram: 0x80085A40 }
      # charControl owns 0x800CB2C0-0x800CB307: the 0x40-byte collision callback
      # state, the camera state pointer, and the shared gravity scalar (resident
      # and overlay memory uses prove the four-byte f32). IDO pads the input
