name: Mickey's Speedway USA (North America)
sha1: 507341c0a40ca3e9a7cee969b396ee53facfb548

# ---------------------------------------------------------------------------
# Measured USA ROM facts (derived from baseroms/mickey.us.z64 itself, by
# disassembling the entrypoint at ROM 0x1000 / VRAM 0x80000400 and by
# entropy + "mipsiness" scanning of the whole 32MB image):
#
#   BSS start (VRAM)          0x80085A40   (lui t0,0x8008 / addiu t0,t0,0x5a40)
#   BSS size                  0x52D10      (lui t1,0x5    / ori   t1,t1,0x2d10)
#   BSS end (VRAM)            0x800D8750
#   Entry jump target (VRAM)  0x800211A0   (lui t2,0x8002 / addiu t2,t2,0x11a0)
#   Initial stack pointer     0x800CEA20   (addiu sp,sp,-0x15E0 after lui 0x800D)
#
#   The boot segment is mapped 1:1: VRAM = ROM + 0x7FFFF400, so the ROM only
#   supplies bytes up to BSS start:
#     ROM(bss_start) = 0x80085A40 - 0x80000400 + 0x1000 = 0x86640
#
# Segment map (ROM offsets):
#   0x001000 - 0x086640   static code + data (resident "main" module; includes
#                         the libultra .text corridor at 0x6F420-0x76D10,
#                         whose file boundaries and symbol names are measured
#                         against DKR's built libultra -- see the `main`
#                         segment's own comment further down)
#   0x086640 - 0x16B0000  data tables + bulk compressed assets (22.16 MiB).
#                         Entropy shows compression proper starting ~0x87000;
#                         0x86640-0x87000 looks like a table of ROM offsets.
#                         Left as one `bin` for now - Phase 3 splits it.
#   0x16B0000 - 0x1848B70 unclassified (1.60 MiB). Nothing points into it: the
#                         resident segment builds exactly four address literals
#                         anywhere in 0x1600000-0x18FFFFF, and they are the four
#                         block bases below. Entropy 5.5-6.4 with a 0.35 MiB
#                         flat run, i.e. neither the asset band's 7.95 nor
#                         resident text's 5.88.
#   0x1848B70 - 0x184C3E0 the three overlay tables, stored flat, uncompressed:
#                         u32 count (375) + RelocTableEntry[375] at 0x1848B70,
#                         RomTableEntry[2004] at 0x1849730,
#                         OverlayHeader[107] at 0x184B680.
#   0x184C3E0 - 0x18F1FE0 107 overlay module images, back to back, each
#                         [.text][.data][relocTable1][relocTable2] (0.65 MiB).
#
#   func_800328CC (VRAM 0x800328CC, ROM 0x334CC) mallocs and DMA-copies the
#   three table blocks into the BSS pointers mainRelocTable / overlayRomTable /
#   overlayTable at boot, through func_8002E3E0 (osInvalDCache + osPiStartDma in
#   0x400 chunks). No decompressor is in that call graph or in
#   runlinkDownloadCode's, which is what loads a module image.
#   0x18F1FE0 - 0x2000000 trailing 0xFF fill (verified byte-by-byte).
# ---------------------------------------------------------------------------

options:
  basename: mickey.us
  target_path: baseroms/mickey.us.z64
  base_path: .
  platform: n64
  compiler: IDO
  header_encoding: ASCII
  find_file_boundaries: True

  ld_script_path: mickey.us.ld
  asm_path: asm
  src_path: src
  build_path: build
  asset_path: assets

  symbol_addrs_path: symbol_addrs.us.txt
  undefined_funcs_auto_path: undefined_funcs_auto.us.txt
  undefined_syms_auto_path: undefined_syms_auto.us.txt
  symbol_name_format: $VRAM

  asm_function_macro: glabel
  asm_function_alt_macro: alabel
  # `glabel`, not splat's `jlabel`, and the reason is asm-processor, not taste.
  # Declaring the .rodata tail gives every jump table typed entries, which makes
  # splat label each jump TARGET in the .text it lands in. asm-processor's own
  # line scanner knows exactly three label macros -- `glabel`, `dlabel`,
  # `endlabel` -- and treats any other macro call in a .text block as an
  # instruction, so a `jlabel` line inside a #pragma GLOBAL_ASM file makes it
  # miscount the section: "incorrectly computed size for section .text". Both
  # macros expand to a global label; `glabel` is the one that also parses.
  # tools/setup_reference_builds.sh patches the same three-macro list into
  # Conker's copy of asm-processor for the same reason.
  #
  # The price, stated rather than hidden: `glabel` opens a `.ent` that only
  # `endlabel` closes, so gas warns "missing .end" once per jump target, 627
  # times in a clean build, on top of the 1471 odd-FP-register warnings section
  # 6.2 of docs/modules.md already accounts for. The ROM is byte-identical
  # either way and the final ELF carries no function-typed .L symbol.
  # `dlabel` is not an alternative: splat would then define that macro twice in
  # include/macro.inc and gas rejects the file outright.
  asm_jtbl_label_macro: glabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  asm_emit_size_directive: False
  # splat's IDO preset otherwise prefixes every disassembled function with a
  # `nonmatching <name>, <size>` marker macro. asm-processor parses the
  # nonmatchings .s files itself and rejects anything before the first
  # `glabel` ("Error: .text block without an initial glabel"), so the marker
  # has to go for `#pragma GLOBAL_ASM` to work at all. Nothing depends on it:
  # progress is measured from what is in src/, not from marker symbols.
  asm_nonmatching_label_macro: ""

  section_order: [".text", ".data", ".rodata", ".bss"]
  # splat 0.35 renamed `auto_all_sections` to `auto_link_sections`.
  auto_link_sections: [".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: True
  #extensions_path: tools/splat_ext
  #libultra_symbols: True
  #hardware_regs: True

segments:
  - name: header
    type: header
    start: 0x0

  - name: boot
    type: bin
    start: 0x40

  # Entrypoint: zeroes BSS, sets SP, jumps to 0x800211A0. See header comment.
  - name: entry
    type: code
    start: 0x1000
    vram: 0x80000400
    subsegments:
      # `asm`, not `hasm`: verified_asm.us.txt records that the original is
      # hand-written (DKR's whole tracked hasm/entrypoint.s.o is Tier-A exact),
      # while `asm` keeps this generated file owned by splat. `hasm` would make
      # splat leave a human-maintained file alone, but asm/ is gitignored and
      # wiped by `gmake distclean`; with `asm`, every re-split refreshes it.
      - [0x1000, asm, entrypoint]

  # Resident static segment. The subsegment split points below were
  # auto-detected by splat's file-boundary heuristic and are kept as-is; they
  # are plausible translation-unit boundaries and get real names as the
  # decompilation progresses.
  - name: main
    type: code
    start: 0x1050
    vram: 0x80000450
    follows_vram: entry
    # diRcp's compiler-owned switch tables begin at the measured four-byte
    # boundary 0x8008387C. Later compiler-owned tables, including font's at
    # 0x80083DF8, retain their measured placement with four-byte subalignment.
    subalign: 0x4
    bss_size: 0x52D10
    subsegments:
      - [0x1050, c, main/audio_manager_1050]
      - [0x2340, c, main/audiomgr]
      - [0x30BC, c, main/amAudioMgrSetScheduleMode]
      - [0x30E0, c, main/audiomgr_30E0]
      - [0x3100, c, main/audio_manager_36D0]
      - [0x45F0, c, main/audio_manager_4C50]
      - [0x4F40, c, main/objects]
      # `track/track.c`: the first and last routines align with JFG's track TU,
      # 40 of 62 similarity-eligible functions place that TU in their top five,
      # two large routines reference all 14 resident `track/track.c` assert
      # strings, and trackSetFogOff is byte-identical to JFG's implementation.
      - [0xC950, c, main/track]
      # JFG's four-function hand-written trackasm sequence, in the same order.
      # Mickey's first three routines are shorter revisions, so this is a
      # tier-B/D file-boundary attribution rather than a whole-object match.
      - [0x16140, asm, main/trackasm]
      # JFG shadows.c begins with shadowInitBuffers immediately after trackasm.
      # The other end is independently fixed by the tier-A
      # shadowBoxPolyOverlap at 0x18FF0, the start of shadows_214A0.c.
      - [0x16A90, c, main/shadows]
      # JFG's shadows_214A0 -> lights boundary is reproduced here at the end
      # of Mickey's shadowMakeYs. The four shadows_214A0 functions use odd FP
      # registers and remain assembly (docs/modules.md sections 3.4 and 6.2);
      # the following lights TU has no odd-FP operands and is eligible for C.
      - [0x18FF0, asm, main/shadows_fp]
      - [0x19310, c, main/lights]
      - [0x1AE60, asm, main/lights2]
      # JFG's eight camlight entry points survive here as Mickey no-op stubs,
      # in the same order.  spranimInit begins immediately after camlightDraw.
      - [0x1BE50, c, main/camlight]
      # Tier-B/D boundary attribution from the object-control dispatch graph,
      # JFG spranim.c ordering, and the masked-skeleton matches documented in
      # docs/modules.md section 3.5.
      - [0x1BEA0, c, main/spranim]
      - [0x1C790, c, main/charControl]
      # Working source split for the resident model system. Three functions
      # are tier-A skeleton matches to JFG's src/models.c.o, including the
      # first function at this existing 16-byte-aligned boundary; the other
      # functions share its model allocator/texture call graph. This is not a
      # whole-object byte match, so docs/modules.md 3.4 keeps the distinction
      # between the working split and a measured original-file boundary.
      - [0x20020, c, main/models]
      # Boot/thread source unit. DKR's src/main.c supplies byte-exact bodies
      # for mainproc and thread1_main; Mickey's stack-check variant is now C,
      # and the next measured source boundary is camera at 0x21EE0.
      - [0x21DA0, c, main/boot]
      # Resident camera state, viewport/projection setup, sprite/model matrices,
      # projection helpers and screen shake. JFG's src/camera.c supplies the
      # ordered role map: camInit is the nearest skeleton at the first function,
      # two interior functions clear the tier-A name threshold, and the run ends
      # with four bytes of alignment at the existing 16-byte 0x25C20 boundary.
      - [0x21EE0, c, main/camera]
      # JFG's joy.c/controller.c.o function run: OS controller setup/read,
      # mapping accessors, stick clamping, and the CIC challenge helper.
      - [0x25C20, c, main/joy]
      # JFG level.c order from levelGetCounts through levelInitRegionFlags.
      # Mickey omits levelGetWorldRegions and the donor's four trailing flag
      # accessors, but the surrounding call graph preserves this TU boundary.
      - [0x263F0, c, main/level]
      # Six main/main.c assert-string references plus the ordered game-window,
      # level-change, and main-state routines identify JFG's main.c lineage.
      - [0x27760, c, main/main]
      # DKR's whole hand-written `math_util.s` object matches this run in its
      # original function order. It remains assembly by design; naming the
      # subsegment lets the progress ledger distinguish verified source asm
      # from compiler-generated code that has not been decompiled yet.
      - [0x2A250, asm, main/math_util]
      # Matrix and vector maths -- six float-only functions, no rodata of their
      # own, which is why this is the first non-linker game TU to be decompiled.
      - [0x2B650, c, main/matrix]
      # The resident allocator. The linked baseline gives the old 2BCD0.s.o a
      # 0xBF0-byte .text section ending exactly where 2C8C0.s.o begins. Its
      # final function ends at 0x2C8B4; the remaining 0xC bytes are alignment.
      - [0x2BCD0, c, main/memory]
      # Five consecutive resident game TUs identified from JFG's published
      # source order, corroborated by Mickey's call graph and function-size
      # sequence. See docs/modules.md section 3.4.
      - [0x2C8C0, c, main/saves]
      - [0x2ECA0, c, main/pi]
      - [0x2F0D0, c, main/screen]
      - [0x2F400, c, main/rcpFast3d]
      - [0x30CD0, c, main/sched]
      # A MEASURED file boundary, not a heuristic one: the whole 0x40-byte
      # .text of the Diddy Kong Racing decomp's built `src/set_rsp_segment.c.o`
      # is byte-identical to ROM 0x323A0-0x323E0 with zero masked words and no
      # second occurrence anywhere in the 32MB image. Its end lands exactly on
      # the runtime linker's start below. Everything above it in this segment
      # is still splat's heuristic.
      - [0x323A0, c, main/rsp_segment]
      # The runtime overlay linker. Identified by the error strings it prints
      # ("ERROR:MIPS_HI16 without matching MIPS_LO16", "WARNING: Unimplemented
      # linkage operation %d") -- byte-identical to Jet Force Gemini's, whose
      # public decomp names the same engine's file runLink.c.
      - [0x323E0, c, main/runlink]
      - [0x33FA0, asm, main/trapDanglingJump]
      # JFG gameVi.c. The boundary is established by the complete ordered
      # sequence of 23 functions: viInit through fb_memcpy, between the
      # measured trapDanglingJump TU and the texInitTextures-shaped function
      # that starts JFG's following textures.c TU at 0x34E60.
      - [0x34180, c, main/gameVi]
      - [0x34E60, c, main/textures_34E60]
      - [0x35008, c, main/texEnableModes]
      - [0x35024, c, main/textures_35024]
      - [0x354A0, c, main/texLoadTextureAddr]
      - [0x354C8, c, main/textures_354C8]
      - [0x37650, c, main/initColourCycle]
      - [0x37680, c, main/frontend_37680]
      - [0x37D50, c, main/frontend_37D50]
      # JFG's menu.c / Mickey's resident front-end menu code. The start is
      # setLanguage followed by initFront; the end is the function after
      # frontCharSelectSetQuitMode, where the code switches to the unrelated
      # "UNKNOWN TRACK" table. Both boundaries are function starts and are
      # 16-byte aligned. See docs/modules.md section 3.4.
      - [0x39350, c, main/menu]
      - [0x3B1A0, c, main/menu_3B1A0]
      # JFG/DKR weather lineage: initWeather leads this run, the second
      # routine weather_clip_planes is already tier A, and the tier-A
      # particles reset at 0x3D5F0 independently fixes the upper boundary.
      - [0x3B480, c, main/weather]
      # Hand-written snow update/vertex pair. snow_vertices uses odd FP
      # registers, and asm-processor cannot safely wrap either routine.
      - [0x3D030, asm, main/weather_snow_asm]
      - [0x3D370, c, main/weather_tail]
      - [0x3D5F0, c, main/particles]
      - [0x43470, c, main/diprint]
      # JFG's resident debug trio, identified from the same source order,
      # call graph and diagnostic strings. diRcpTrace owns four trace-buffer
      # routines before diRcpPrintDL; diRcp owns the GBI pretty-printer and its
      # helpers; diCpu begins with the tier-A diCpuTraceInit match and runs to
      # the measured get_stack_pointer boundary.
      - [0x45760, c, main/diRcpTrace]
      - [0x459C0, c, main/diRcp]
      - [0x465B0, c, main/diCpu]
      # Measured boundary: the whole 0x10 .text of DKR's built
      # `src/get_stack_pointer.c.o` matches here with zero masked words, and
      # splat's own split points already agreed on both ends.
      - [0x47A60, c, main/get_stack_pointer]
      # JFG fx.c lineage: Mickey starts at fxFreeCone (the earlier JFG level-
      # effect routines are absent), carries the cone/wake/effect call graph,
      # and ends where the following font.c block begins.
      - [0x47A70, c, main/fx]
      # Evidence-backed source boundary for the resident font module. JFG's
      # font.c starts with fontSetWindow0, whose 0x24 bytes match here (2 of 9
      # words relocated, ROM-wide unique), and its final routine is
      # fontYSpacing, corresponding to Mickey's 0x4E1C0 leaf. The next
      # function at 0x4E1E0 is the separate 0x170-byte osCreatePiManager
      # routine. The font object as a whole is not byte-identical, so this is
      # an ordered-function and two-sided-boundary claim, not a whole-.text
      # claim.
      - [0x4BC40, c, main/font]
      # The PI-manager/rzip prefix and huft builder form the compiler-exact C
      # half of the inflate subsystem. DKR's src/gzip.c identifies this
      # six-function source unit; each function is independently matched.
      - [0x4E1E0, c, main/gzip]
      # Measured boundary. The whole 0xA74-byte .text of DKR's built
      # `src/hasm/gzip_asm.s.o` -- the hand-written inflate core the asset
      # loader runs -- matched here in one piece, 98 of 669 words masked, no
      # second occurrence in the 32MB image. Named subsegment, five named
      # functions; the byte-identity claim covers 0x4EA60-0x4F4D4 and the
      # remaining 0xC bytes to the next split are padding.
      - [0x4EA60, asm, main/gzip_asm]
      - [0x4F4E0, c, main/block_4F4E0]
      - [0x4FC30, asm, libultra/exceptasm]
      - [0x505E0, c, libultra/createthread]
      - [0x506D0, c, main/block_506D0]
      - [0x50820, asm, main/refractOutputAssembler]
      # Resident animation/collision sequence. Individual-function skeleton
      # evidence ties the leading functions to JFG anim.c, the later functions
      # to JFG hit.c, and the final function to JFG fmv.c; no 16-byte-aligned
      # internal object boundary is proven, so the existing whole block is one
      # source subsegment until stronger section evidence appears.
      - [0x50C00, c, main/anim]
      - [0x58570, c, main/flash_58570]
      - [0x58810, c, libultra/osFlashClearStatus]
      - [0x5885C, c, main/flash_5885C]
      - [0x58C0C, asm]
      - [0x58C10, c, main/flash_58C10]
      - [0x58E50, c, main/vehicle_sounds]
      - [0x59B90, c, main/osBootRamTest]
      - [0x59BF0, asm]
      - [0x59DB0, asm]
      - [0x5B300, c, main/models_5B300]
      - [0x5C310, c, main/gsSnd]
